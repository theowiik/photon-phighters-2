name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-os:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Check
        run: mise run check

  check:
    needs: check-os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require check to pass on every OS
        run: test "${{ needs.check-os.result }}" = success

  build-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Build
        run: mise run build
